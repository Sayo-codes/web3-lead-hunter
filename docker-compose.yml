services:
  web:
    build: .
    command: npm run start
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_MODE: supabase
      DISABLE_IN_PROCESS_WORKER: "true"
    restart: unless-stopped
    depends_on:
      - worker

  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment:
      DB_MODE: supabase
    restart: unless-stopped
    healthcheck:
      disable: true
